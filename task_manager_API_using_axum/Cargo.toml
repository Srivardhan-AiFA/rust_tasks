[package]
name = "task_manager_API_using_axum"
version = "0.1.0"
edition = "2021"


[dependencies]
# Web framework
axum = "0.7"

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# JSON serialization / deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For shared state (Arc, Mutex, RwLock)
# (comes from std, no crate needed)

# Logging (optional but harmless even now)
tracing = "0.1"

argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }

jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }

tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tower-http = { version = "0.5", features = ["trace"] }

[dev-dependencies]
tower = "0.4"
http = "1.0"